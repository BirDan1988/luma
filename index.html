<!-- how do you want to feel? -->

<div class="w-full">
    <div class="container mx-auto px-3 ">
        <span class="text-[14px] sm:text-sm text-secondary flex justify-center  uppercase font-inter font-semibold">YOUR MOMENT STARTS HERE</span>
        <h2 class="text-xl sm:text-2xl text-heading font-poppins font-semibold text-center">How do you want to feel?</h2>
    </div>
    <div class="container mx-auto px-3 mt-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="card">
                <div class="card-info  rounded-xl border border-gray-200 hover:border-[#240E85] hover:shadow-lg hover:-translate-y-1 overflow-hidden transition-all duration-300 ease group">
                    <div class="top-info px-4 pt-4">
                        <div class="icon-wave size-[45px] sm:size-[60px] bg-[#CDBDFA] group-hover:bg-[#240E85]  rounded-full flex items-center justify-center transition-all duration-300 ease">
                        <i class="fa-solid fa-water text-xl sm:text-3xl text-[#240E85] group-hover:text-white  duration-300 transition-all ease"></i>
                    </div>
                    <h2 class=" text-xl sm:text-2xl text-heading font-poppins font-semibold mt-3">Calm</h2>
                    <p class="text-sm sm:text-[18px] text-para_light font-medium font-inter mt-2">Slow down and
                    <br>find your balance.</p>
                    </div>
                    <div class="image w-full relative">
                       <img class="w-full object-cover block" src="images/shape-1.png">
                       <i class="fa-solid fa-arrow-right text-2xl absolute right-6 bottom-3 text-[#240E85] group-hover:translate-x-1 transition-all duration-300 ease"></i>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-info  rounded-xl border border-gray-200 hover:border-[#BF1A1D] hover:shadow-lg hover:-translate-y-1 overflow-hidden transition-all duration-300 ease group">
                    <div class="top-info px-4 pt-4">
                        <div class="icon-wave size-[45px] sm:size-[60px] bg-[#E4282B]/20 group-hover:bg-[#BF1A1D]  rounded-full flex items-center justify-center transition-all duration-300 ease">
                        <i class="fa-solid fa-bullseye text-xl sm:text-3xl text-[#BF1A1D] group-hover:text-white  duration-300 transition-all ease"></i>
                    </div>
                    <h2 class=" text-xl sm:text-2xl text-heading font-poppins font-semibold mt-3">Focused</h2>
                    <p class="text-sm sm:text-[18px] text-para_light font-medium font-inter mt-2">Get clean, eliminate
                    <br>distractions.</p>
                    </div>
                    <div class="image w-full relative">
                       <img class="w-full object-cover block" src="images/shape-2.png">
                       <i class="fa-solid fa-arrow-right text-2xl absolute right-6 bottom-3 text-[#BF1A1D] group-hover:translate-x-1 transition-all duration-300 ease"></i>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-info  rounded-xl border border-gray-200 hover:border-[#A4810D] hover:shadow-lg hover:-translate-y-1 overflow-hidden transition-all duration-300 ease group">
                    <div class="top-info px-4 pt-4">
                        <div class="icon-wave size-[45px] sm:size-[60px] bg-[#E3B70A]/20 group-hover:bg-[#A4810D]  rounded-full flex items-center justify-center transition-all duration-300 ease">
                        <i class="fa-solid fa-star-of-david text-xl sm:text-3xl text-[#A4810D] group-hover:text-white  duration-300 transition-all ease"></i>
                    </div>
                    <h2 class=" text-xl sm:text-2xl text-heading font-poppins font-semibold mt-3">Creative</h2>
                    <p class="text-sm sm:text-[18px] text-para_light font-medium font-inter mt-2">Open your mind and
                    <br>spark new ideas.</p>
                    </div>
                    <div class="image w-full relative">
                       <img class="w-full object-cover block" src="images/shape-3.png">
                       <i class="fa-solid fa-arrow-right text-2xl absolute right-6 bottom-3 text-[#A4810D] group-hover:translate-x-1 transition-all duration-300 ease"></i>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-info  rounded-xl border border-gray-200 hover:border-[#11802D] hover:shadow-lg hover:-translate-y-1 overflow-hidden transition-all duration-300 ease group">
                    <div class="top-info px-4 pt-4">
                        <div class="icon-wave size-[45px] sm:size-[60px] bg-[#34C759]/20 group-hover:bg-[#11802D]  rounded-full flex items-center justify-center transition-all duration-300 ease">
                        <i class="fa-solid fa-rotate text-xl sm:text-3xl text-[#11802D] group-hover:text-white  duration-300 transition-all ease"></i>
                    </div>
                    <h2 class=" text-xl sm:text-2xl text-heading font-poppins font-semibold mt-3">Reset</h2>
                    <p class="text-sm sm:text-[18px] text-para_light font-medium font-inter mt-2">Let go recharge
                    <br>and start fresh.</p>
                    </div>
                    <div class="image w-full relative">
                       <img class="w-full object-cover block" src="images/shape-4.png">
                       <i class="fa-solid fa-arrow-right text-2xl absolute right-6 bottom-3 text-[#11802D] group-hover:translate-x-1 transition-all duration-300 ease"></i>
                    </div>
                </div>
            </div>
            
        </div>

    </div>
</div>
